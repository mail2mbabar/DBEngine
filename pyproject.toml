[project]
name = "aqie-chatdb"
version = "0.2.0"
description = "Natural-language queries over uploaded CSV/Excel databases"
readme = "README.md"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["aqie"]
